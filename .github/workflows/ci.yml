name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  quality:
    name: Code style & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress
      - run: composer cs
      - run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - run: composer test

  mysql:
    name: Integration (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: storm
          MYSQL_DATABASE: storm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pstorm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      STORM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=storm_test'
      STORM_TEST_USER: root
      STORM_TEST_PASSWORD: storm
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite integration
